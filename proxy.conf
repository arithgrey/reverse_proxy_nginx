# Reflect the requesting origin to allow any local dev origin with credentials
map $http_origin $cors_origin {
    default                     "";
    "http://localhost"          "http://localhost";
    "http://localhost:80"       "http://localhost";
    "http://localhost:5173"     "http://localhost:5173";
    "http://localhost:8000"     "http://localhost:8000";
    "http://enidservice.tech"   "http://enidservice.tech";
    "https://enidservice.tech"  "https://enidservice.tech";
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://localhost:5173/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 8000;
    server_name localhost;

    # Strip upstream CORS headers so we control them exclusively here
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # ── enid-store (productos, categorias, primary-components…)
    # Frontend: enid/categorias/   →   8085: categorias/
    location /enid/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Store-Id';
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Store-Id' always;
        proxy_pass http://localhost:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── OAuth (login, signup, user…)
    # Frontend: /oauth/login/sigin/  →  8083: login/sigin/
    location /oauth/ {
